name: Dependency remediation
on:
  push:
    branches:
      - security/dependency-remediation
permissions:
  contents: write
jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: security/dependency-remediation
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Apply non-breaking security updates
        run: |
          npm ci --no-audit --no-fund
          npm audit fix --no-fund || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet -- package.json package-lock.json; then
            git add package.json package-lock.json
            git commit -m 'security: apply compatible dependency updates'
            git fetch origin security/dependency-remediation
            git rebase origin/security/dependency-remediation
            git push origin HEAD:security/dependency-remediation
          fi
      - name: Verify lint and syntax
        run: |
          npm ci --no-audit --no-fund
          npm run lint
          npm run check:syntax
      - name: Run complete test suite
        run: npm test
      - name: Verify startup dependencies
        run: npm run check:startup
      - name: Require no high or critical production advisories
        run: npm audit --omit=dev --audit-level=high
