name: JavaScript checks

on:
  push:
  pull_request:

concurrency:
  group: lobo-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    # 22 é o mínimo suportado; 24 é o Node das hospedagens (Bronxys/Pterodactyl).
    name: test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    env:
      CI: "true"
      NODE_ENV: test
      LOBO_API_URL: ""
      LOBO_LICENSE_KEY: ""
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Check JavaScript syntax
        run: npm run check:syntax
      - name: Check CI security policy
        run: node --test .github/workflow.test.cjs
      - name: Run tests
        run: npm test
      - name: Check startup
        run: npm run check:startup
      - name: Rebuild and verify managed-file integrity
        run: |
          npm run release:manifest
          npm run release:verify
      - name: Enforce production dependency security audit
        run: npm run security
