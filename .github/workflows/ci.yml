name: JavaScript checks
on:
  push:
  pull_request:
concurrency:
  group: lobo-ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Reconcile lockfile before clean install
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Persist lockfile on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.node == 22
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add package-lock.json
            git commit -m 'chore: refresh secure dependency lockfile'
            git pull --rebase origin main
            git push
          fi
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run check:syntax
      - run: npm test
      - run: npm run check:startup
      - name: Rebuild integrity manifest for this checkout
        run: npm run release:manifest
      - run: npm run release:verify
      - name: Enforce production dependency security audit
        run: npm run security
