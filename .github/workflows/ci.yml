name: JavaScript checks
on:
  push:
  pull_request:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run check:syntax
      - run: npm test
      - run: npm run check:startup
      - name: Refresh integrity manifest on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.node == 22
        run: |
          npm run release:manifest
          if ! git diff --quiet -- .version manifest.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add .version manifest.json
            git commit -m 'chore: refresh managed-file integrity manifest'
            git push
          fi
      - name: Rebuild integrity manifest for this checkout
        run: npm run release:manifest
      - run: npm run release:verify
      - name: Enforce production dependency security audit
        run: npm run security
