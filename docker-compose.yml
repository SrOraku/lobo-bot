services:
  lobo-bot:
    build: .
    container_name: lobo-bot
    restart: unless-stopped
    volumes:
      - ./sessions:/app/sessions
      - ./data:/app/data
      - ./storage/alcateia:/app/storage/alcateia
      - ./logs:/app/logs
      - ./updates:/app/updates
      - ./plugins:/app/plugins
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - TZ=America/Sao_Paulo
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: lobo-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  redis-data:
